<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Was, Wasn&#39;t · Демо</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow:hidden; background: #10151d; color: #f7ead1; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; background: #10151d; padding: 24px; }
    progress { width: min(360px, 80vw); accent-color: #e7b85d; }
    #error { position: fixed; bottom: 20px; left: 20px; right: 20px; padding: 16px; background: #592c24; white-space: pre-wrap; }
    [hidden] { display: none !important; }
    #input-controls { display:block; margin-bottom:8px; font-size:12px; }
    #fullscreen-button { position:fixed; bottom:max(8px,env(safe-area-inset-bottom)); right:max(8px,env(safe-area-inset-right)); z-index:7; min-height:44px; }
    #fullscreen-note { position:fixed; bottom:60px; right:8px; z-index:8; max-width:320px; padding:12px; background:#302d25; }
    button, select, input { font:inherit; color:#f7ead1; background:#302d25; border:1px solid #a78b5a; border-radius:6px; padding:8px; }
    #portrait { position:fixed; inset:0; z-index:20; display:grid; place-content:center; text-align:center; background:#10151d; font-size:24px; }
    #console-panel { position:fixed; z-index:10; left:8px; top:60px; width:min(560px,95vw); background:#10151df2; border:1px solid #a78b5a; padding:10px; }
    #console-output { white-space:pre-wrap; max-height:32vh; overflow:auto; font:12px monospace; }
    #console-form { display:flex; gap:6px; } #console-command { min-width:0; flex:1; }
    #game { position:absolute; inset:0; height:100%; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Was, Wasn&#39;t"></canvas>
  <div id="loading"><strong>Was, Wasn&#39;t</strong><span id="status">Загружаем демо…</span><progress id="progress" max="1" value="0"></progress></div>
  <div id="error" role="alert" hidden></div>

  <button id="fullscreen-button" data-key="mobile.fullscreen" hidden>На весь экран</button>
  <div id="fullscreen-note" role="status" data-key="mobile.fullscreenUnavailable" hidden>Полный экран недоступен. Откройте ссылку в обычном браузере через меню ⋮.</div>
  <div id="portrait" hidden><span data-key="mobile.rotatePhone">Поверните телефон</span></div>
  <section id="console-panel" hidden aria-label="Служебная консоль">
  <label id="input-controls"><span data-key="mobile.input">Управление</span>
    <select id="input-mode" aria-label="Управление"><option value="auto" data-key="mobile.auto">Автоматически</option><option value="mouse" data-key="mobile.mouse">Мышь</option><option value="touch" data-key="mobile.touch">Сенсорное</option></select>
  </label>
    <div><button data-command="start">start</button> <button data-command="cancel">cancel</button> <button data-command="stop">stop</button> <button data-command="ui list">ui list</button> <button data-command="help">help</button></div>
    <pre id="console-output">Служебная консоль. start — забрать ввод; stop — вернуть.</pre>
    <form id="console-form"><input id="console-command" autocomplete="off" spellcheck="false" aria-label="Команда"><button type="submit">Выполнить</button></form>
  </section>
  <script src="TemplateData/controls.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    function showError(message) {
      const box = document.getElementById('error');
      box.hidden = false;
      box.textContent = 'Не удалось запустить игру. Попробуйте обновить страницу.\n' + message;
    }
    const config = {
      dataUrl: 'Build/WebGLHotfix.data.6e38ccabb730.unityweb',
      frameworkUrl: 'Build/WebGLHotfix.framework.js.cc60c835b2b0.unityweb',
      codeUrl: 'Build/WebGLHotfix.wasm.fccae43e4ab4.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Was Wasn't",
      productVersion: "0.1.0",
      // Синхронизация сохранений вызывается явно после записей из C#.
      autoSyncPersistentDataPath: false,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => { if (type === 'error') { const box = document.getElementById('error'); box.hidden = false; box.textContent = message; } else console.warn(message); }
    };
    const script = document.createElement('script');
    script.src = 'Build/WebGLHotfix.loader.294d02f63536.js';
    script.onerror = () => showError('Не удалось загрузить файлы игры.');
    script.onload = () => createUnityInstance(canvas, config, value => {
      document.getElementById('progress').value = value;
      document.getElementById('status').textContent = 'Загрузка: ' + Math.round(value * 100) + '%';
    }).then(instance => {
      window.unityInstance = instance;
      window.wasWasntControlsReady(instance);
      loading.hidden = true;
      canvas.focus();
    }).catch(showError);
    document.body.appendChild(script);
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
